<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Whisper Transcrição</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }
    .container {
      background: white;
      padding: 20px;
      max-width: 600px;
      margin: auto;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    textarea {
      width: 100%;
      height: 200px;
      margin-top: 10px;
      padding: 10px;
    }
    code {
      background: #eee;
      display: block;
      padding: 6px;
      margin-top: 10px;
      font-size: 13px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Transcrição de Áudio</h1>
    <form id="uploadForm">
      <input type="file" id="audioFile" accept="audio/*" required />
      <button type="submit">Enviar</button>
    </form>

    <p id="status">Aguardando envio...</p>
    <textarea id="transcription" readonly placeholder="A transcrição aparecerá aqui..."></textarea>

    <p><strong>URL da última verificação:</strong></p>
    <code id="requestUrl">Nenhuma requisição feita ainda...</code>
  </div>

  <script>
    const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxVFDUXp4Il62w2f6h6PGXevJFK6gIQzFc-gQj7s3M6v_OAnmuQPxEQrUaSWQJA-1FIQA/exec";

    document.getElementById("uploadForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fileInput = document.getElementById("audioFile");
      const file = fileInput.files[0];
      const status = document.getElementById("status");

      if (!file) {
        alert("Selecione um arquivo de áudio.");
        return;
      }

      status.textContent = "Enviando arquivo...";

      const reader = new FileReader();
      reader.onload = async () => {
        const base64 = reader.result.split(',')[1];

        const form = new FormData();
        form.append("audio", base64);
        form.append("filename", file.name);     // Nome correto
        form.append("mimeType", file.type);     // Tipo MIME

        try {
          const res = await fetch(WEBAPP_URL, {
            method: "POST",
            body: form
          });

          const result = await res.json();

          if (result.success) {
            status.textContent = "✅ Áudio enviado com sucesso. Aguardando transcrição...";
            pollTranscription(file.name + ".txt");
          } else {
            status.textContent = "❌ Erro: " + result.error;
          }
        } catch (err) {
          console.error("Erro ao conectar com o Apps Script:", err);
          status.textContent = "❌ Erro de conexão com o servidor.";
        }
      };

      reader.readAsDataURL(file);
    });

    function pollTranscription(txtFilename) {
      const status = document.getElementById("status");
      const transcriptionBox = document.getElementById("transcription");
      const requestUrlElement = document.getElementById("requestUrl");

      const requestUrl = `${WEBAPP_URL}?filename=${encodeURIComponent(txtFilename)}`;
      requestUrlElement.textContent = requestUrl;

      const interval = setInterval(async () => {
        try {
          const res = await fetch(requestUrl);
          const json = await res.json();
          if (json.success) {
            clearInterval(interval);
            transcriptionBox.value = json.content;
            status.textContent = "✅ Transcrição concluída!";
          }
        } catch (e) {
          console.log("Aguardando transcrição...");
        }
      }, 5000);
    }
  </script>
</body>
</html>
