<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Upload de MP3 para o Google Drive</title>
</head>
<body>
  <h2>Enviar MP3 para o Drive</h2>
  <input type="file" id="audioInput" accept=".mp3" />
  <button onclick="uploadAudio()">Enviar</button>
  <p id="status"></p>

  <script>
    async function uploadAudio() {
      const input = document.getElementById('audioInput');
      const status = document.getElementById('status');

      if (!input.files.length) {
        status.textContent = 'Selecione um arquivo MP3 primeiro.';
        return;
      }

      const file = input.files[0];
      if (file.type !== 'audio/mpeg') {
        status.textContent = 'O arquivo precisa ser um MP3.';
        return;
      }

      status.textContent = 'Lendo e enviando...';

      const reader = new FileReader();
      reader.onloadend = async () => {
        const base64Data = reader.result.split(',')[1]; // Remove o cabeçalho "data:audio/mpeg;base64,..."

        const payload = {
          audio: base64Data,
          filename: file.name,
          mimeType: file.type
        };

        try {
          const response = await fetch('https://script.google.com/macros/s/AKfycbxIA7ZUcqoXwietOeAYso6m2n-11FVLktA45SLfs44XVjPoJTnxQpsB7P4ngXvN16lyHw/exec', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
          });

          const result = await response.json();

          if (result.success) {
            status.textContent = 'Upload realizado com sucesso!';
          } else {
            status.textContent = 'Erro: ' + result.error;
          }
        } catch (err) {
          status.textContent = 'Erro de conexão: ' + err.message;
        }
      };

      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
