<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Upload de MP3 para Supabase (Base64)</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; }
    input[type="file"] { margin-bottom: 16px; }
    button { padding: 8px 16px; font-size: 16px; }
    #status { margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Enviar MP3 para Supabase</h2>

  <input type="file" id="audioInput" accept=".mp3" />
  <br>
  <button onclick="uploadAudio()">Enviar</button>

  <p id="status"></p>

  <script>
    const supabase = window.supabase.createClient(
      'https://bkueljjvhijojzcyodvk.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJrdWVsamp2aGlqb2p6Y3lvZHZrIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc0MzUwNTQ4OSwiZXhwIjoyMDU5MDgxNDg5fQ.o-G5KmxoyfQjeNM5e7rbgxpryOHYC9k1OIo9fYzyeYE'
    );

    async function uploadAudio() {
      const fileInput = document.getElementById('audioInput');
      const status = document.getElementById('status');

      if (!fileInput.files.length) {
        status.textContent = '⚠️ Selecione um arquivo MP3.';
        return;
      }

      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onloadend = async () => {
        const base64 = reader.result.split(',')[1]; // remove prefixo data:audio/mp3;base64,

        status.textContent = 'Enviando para o Supabase...';

        const { data, error } = await supabase
          .from('audios')
          .insert([{
            filename: file.name,
            base64: base64,
            status: 'aguardando'
          }]);

        if (error) {
          console.error(error);
          status.textContent = '❌ Erro ao salvar no Supabase.';
        } else {
          status.textContent = '✅ Upload concluído com sucesso!';
        }
      };

      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
