<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Whisper Transcrição</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }
    .container {
      background: white;
      padding: 20px;
      max-width: 600px;
      margin: auto;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    textarea {
      width: 100%;
      height: 200px;
      margin-top: 10px;
      padding: 10px;
    }
    code {
      background: #eee;
      display: block;
      padding: 6px;
      margin-top: 10px;
      font-size: 13px;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Transcrição de Áudio</h1>
    <form id="uploadForm">
      <input type="file" id="audioFile" accept="audio/*" required />
      <button type="submit">Enviar</button>
    </form>

    <p id="status">Aguardando envio...</p>
    <textarea id="transcription" readonly placeholder="A transcrição aparecerá aqui..."></textarea>

    <p><strong>URL da última verificação:</strong></p>
    <code id="requestUrl">Nenhuma requisição feita ainda...</code>
  </div>

 <script>
  const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbydCJST4xDf_7jI9fuscWUmj6saaZz2NkiK1M88b1jRwiUCNzF8a9Aqf_dIzAxuGagi6w/exec";

  document.getElementById("uploadForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const fileInput = document.getElementById("audioFile");
    const file = fileInput.files[0];
    const status = document.getElementById("status");
    const requestUrlElement = document.getElementById("requestUrl");

    if (!file) {
      status.textContent = "❌ Nenhum arquivo selecionado.";
      requestUrlElement.textContent = "⚠️ Nenhum arquivo para gerar a URL.";
      return;
    }

    status.textContent = "⏳ Enviando arquivo...";
    requestUrlElement.textContent = "⏳ Preparando envio...";

    const reader = new FileReader();
    reader.onload = async () => {
      const base64 = reader.result.split(',')[1];

      const payload = {
        audio: base64,
        filename: file.name,
        mimeType: file.type
      };

      try {
        const res = await fetch(WEBAPP_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          status.textContent = `❌ Erro HTTP: ${res.status}`;
          requestUrlElement.textContent = "❌ Erro ao enviar áudio.";
          return;
        }

        const result = await res.json();

        if (result.success) {
          status.textContent = "✅ Áudio enviado. Aguardando transcrição...";
          pollTranscription(file.name + ".txt");
        } else {
          status.textContent = "❌ Erro ao enviar: " + (result.error || "Erro desconhecido");
          requestUrlElement.textContent = "❌ Erro no processamento do Apps Script.";
        }
      } catch (err) {
        console.error("Erro ao conectar com o Apps Script:", err);
        status.textContent = "❌ Erro de conexão com o servidor.";
        requestUrlElement.textContent = "❌ Erro na comunicação com o Apps Script.";
      }
    };

    reader.readAsDataURL(file);
  });

  function pollTranscription(txtFilename) {
    const status = document.getElementById("status");
    const transcriptionBox = document.getElementById("transcription");
    const requestUrlElement = document.getElementById("requestUrl");

    if (!txtFilename) {
      status.textContent = "❌ Nome do arquivo inválido.";
      requestUrlElement.textContent = "⚠️ Nome de transcrição não gerado.";
      return;
    }

    const requestUrl = `${WEBAPP_URL}?filename=${encodeURIComponent(txtFilename)}`;
    requestUrlElement.textContent = requestUrl;

    let tentativas = 0;
    const interval = setInterval(async () => {
      try {
        const res = await fetch(requestUrl);

        if (!res.ok) {
          clearInterval(interval);
          requestUrlElement.textContent = `❌ Erro HTTP: ${res.status}`;
          status.textContent = "❌ Falha ao consultar transcrição.";
          return;
        }

        const json = await res.json();

        if (typeof json.success === "undefined") {
          clearInterval(interval);
          status.textContent = "❌ Resposta inválida do servidor.";
          requestUrlElement.textContent = "❌ Formato de resposta inesperado.";
          return;
        }

        if (json.success) {
          clearInterval(interval);
          transcriptionBox.value = json.content;
          status.textContent = "✅ Transcrição concluída!";
        } else {
          tentativas++;
          status.textContent = `⏳ Aguardando transcrição... (tentativa ${tentativas})`;
        }
      } catch (e) {
        clearInterval(interval);
        status.textContent = "❌ Erro ao buscar transcrição.";
        requestUrlElement.textContent = `❌ Exceção: ${e.message}`;
        console.error("Erro em pollTranscription:", e);
      }
    }, 5000);
  }
</script>

</body>
</html>
